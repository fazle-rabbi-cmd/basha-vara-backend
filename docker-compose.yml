
services:
  redis:
    image: redis:7-alpine
    container_name: basha-vara-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - basha_vara_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:17
    container_name: basha-vara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: basha_vara
      POSTGRES_USER: basha_vara_user
      POSTGRES_PASSWORD: local_dev_password_change_me
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - basha_vara_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basha_vara_user -d basha_vara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  basha_vara_postgres_data:
  basha_vara_redis_data:
